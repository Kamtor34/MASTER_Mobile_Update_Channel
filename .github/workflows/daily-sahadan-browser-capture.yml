name: Daily Sahadan Browser Capture

on:
  schedule:
    # 06:20 Europe/Istanbul (UTC+3)
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sahadan-daily-browser-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout channel
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser automation
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Calculate last three completed days
        id: dates
        shell: bash
        run: |
          set -euo pipefail
          today="$(TZ=Europe/Istanbul date +%F)"
          end="$(TZ=Europe/Istanbul date -d "$today - 1 day" +%F)"
          start="$(TZ=Europe/Istanbul date -d "$today - 3 day" +%F)"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "end=$end" >> "$GITHUB_OUTPUT"
          echo "Daily capture window: $start through $end (Europe/Istanbul)"

      - name: Capture Sahadan JSON through Chromium
        env:
          START_DATE: ${{ steps.dates.outputs.start }}
          END_DATE: ${{ steps.dates.outputs.end }}
        run: |
          set -euo pipefail
          output="sahadan_browser_capture_${START_DATE}_${END_DATE}.json"
          python tools/capture_sahadan_browser_json.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --output "$output"
          test -s "$output"
          python -m json.tool "$output" >/dev/null
          echo "Capture validated: $output"

      - name: Commit capture and start the existing rescue importer
        env:
          GH_TOKEN: ${{ github.token }}
          START_DATE: ${{ steps.dates.outputs.start }}
          END_DATE: ${{ steps.dates.outputs.end }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          file="sahadan_browser_capture_${START_DATE}_${END_DATE}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "Automated Sahadan browser capture: $START_DATE to $END_DATE"
          git push origin HEAD:main
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/import-sahadan-rescue.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Existing rescue importer dispatched for $START_DATE..$END_DATE"
