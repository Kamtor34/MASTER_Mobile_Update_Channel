name: Import Sahadan Rescue Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sahadan_rescue_package_*.zip'

permissions:
  contents: write

concurrency:
  group: master-mobile-update
  cancel-in-progress: false

jobs:
  import-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout channel
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unpack and verify rescue package
        id: input_check
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          for candidate in sahadan_rescue_package_????-??-??_????-??-??.zip; do
            [ -f "$candidate" ] && packages+=("$candidate")
          done
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No rescue package present; safely skipping."
            exit 0
          fi
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one rescue package, found ${#packages[@]}." >&2
            exit 1
          fi

          package="${packages[0]}"
          if [[ ! "$package" =~ ^sahadan_rescue_package_([0-9]{4}-[0-9]{2}-[0-9]{2})_([0-9]{4}-[0-9]{2}-[0-9]{2})\.zip$ ]]; then
            echo "Package filename must include a start and end date." >&2
            exit 1
          fi
          start="${BASH_REMATCH[1]}"
          end="${BASH_REMATCH[2]}"

          PACKAGE_FILE="$package" START_DATE="$start" END_DATE="$end" GITHUB_OUTPUT_FILE="$GITHUB_OUTPUT" python - <<'PY'
          import csv, gzip, hashlib, json, os
          from datetime import date, timedelta
          from pathlib import Path
          from zipfile import ZipFile

          package = Path(os.environ["PACKAGE_FILE"])
          start = date.fromisoformat(os.environ["START_DATE"])
          end = date.fromisoformat(os.environ["END_DATE"])
          if start > end:
              raise SystemExit("Package start date is after end date")

          stem = package.stem.replace("sahadan_rescue_package_", "sahadan_rescue_rows_", 1)
          csv_name = stem + ".csv.gz"
          meta_name = stem + ".meta.json"
          with ZipFile(package) as archive:
              names = archive.namelist()
              if len(names) != 2 or set(names) != {csv_name, meta_name}:
                  raise SystemExit(f"Unexpected ZIP contents: {names}")
              csv_bytes = archive.read(csv_name)
              meta_bytes = archive.read(meta_name)

          outdir = Path(".tmp/rescue-in")
          outdir.mkdir(parents=True, exist_ok=True)
          input_path = outdir / csv_name
          meta_path = outdir / meta_name
          input_path.write_bytes(csv_bytes)
          meta_path.write_bytes(meta_bytes)

          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          if meta.get("csv_file") != csv_name:
              raise SystemExit("Metadata filename does not match CSV")
          if meta.get("start_date") != start.isoformat() or meta.get("end_date") != end.isoformat():
              raise SystemExit("Metadata date range does not match package filename")
          digest = hashlib.sha256(csv_bytes).hexdigest()
          if digest != meta.get("csv_sha256"):
              raise SystemExit("CSV SHA-256 does not match metadata")

          expected = []
          cur = start
          while cur <= end:
              expected.append(cur.isoformat())
              cur += timedelta(days=1)
          if set(meta.get("days", {})) != set(expected):
              raise SystemExit("Metadata is missing one or more requested dates")
          if int(meta.get("source_rows_seen", 0)) < int(meta.get("finished_rows_seen", 0)):
              raise SystemExit("Metadata source/finished counts are inconsistent")

          with gzip.open(input_path, "rt", encoding="utf-8-sig", newline="") as stream:
              reader = csv.DictReader(stream)
              required = {"match_id", "date", "league", "home", "away", "home_score", "away_score",
                          "ms1", "msx", "ms2", "kg_var", "kg_yok", "alt25", "ust25"}
              if not required.issubset(set(reader.fieldnames or [])):
                  raise SystemExit("CSV columns do not match the MASTER import schema")
              rows = list(reader)
          if len(rows) != int(meta.get("finished_rows_seen", -1)):
              raise SystemExit("CSV row count differs from metadata")
          if sorted({row.get("date", "") for row in rows}) != expected:
              raise SystemExit("CSV does not contain every expected date")
          outputs = Path(os.environ["GITHUB_OUTPUT_FILE"])
          with outputs.open("a", encoding="utf-8") as stream:
              stream.write("present=true\n")
              stream.write(f"input={input_path}\n")
              stream.write(f"meta={meta_path}\n")
              stream.write(f"package={package.name}\n")
              stream.write(f"start={start.isoformat()}\n")
              stream.write(f"end={end.isoformat()}\n")
              stream.write(f"source_rows_seen={int(meta['source_rows_seen'])}\n")
          print(f"RESCUE_PACKAGE_OK dates={start}..{end} finished={len(rows)} source={meta['source_rows_seen']} sha256={digest}")
          PY

      - name: Merge validated rescue data
        if: steps.input_check.outputs.present == 'true'
        shell: bash
        env:
          INPUT_FILE: ${{ steps.input_check.outputs.input }}
          START_DATE: ${{ steps.input_check.outputs.start }}
          END_DATE: ${{ steps.input_check.outputs.end }}
          SOURCE_ROWS_SEEN: ${{ steps.input_check.outputs.source_rows_seen }}
        run: |
          set -euo pipefail
          python tools/import_sahadan_rescue.py \
            --input "$INPUT_FILE" \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --source-rows-seen "$SOURCE_ROWS_SEEN"

      - name: Validate channel output
        if: steps.input_check.outputs.present == 'true'
        shell: bash
        env:
          EXPECTED_END: ${{ steps.input_check.outputs.end }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, gzip, hashlib, json, os
          from pathlib import Path
          m = json.loads(Path("updates/manifest.json").read_text(encoding="utf-8"))
          current = Path("updates/releases/master_delta_current.csv.gz")
          incremental = Path("updates/releases/master_delta_incremental.csv.gz")
          assert m["enabled"] is True
          assert m["latest_date"] >= os.environ["EXPECTED_END"]
          assert hashlib.sha256(current.read_bytes()).hexdigest() == m["sha256"]
          assert hashlib.sha256(incremental.read_bytes()).hexdigest() == m["incremental_sha256"]
          with gzip.open(current, "rt", encoding="utf-8", newline="") as f:
              rows = sum(1 for _ in csv.DictReader(f))
          with gzip.open(incremental, "rt", encoding="utf-8", newline="") as f:
              inc_rows = sum(1 for _ in csv.DictReader(f))
          assert rows == m["package_rows"]
          assert inc_rows == m["incremental_rows"]
          assert inc_rows > 0
          print(f"RESCUE_IMPORT_OK latest={m['latest_date']} rows={rows} changed={inc_rows} version={m['version']}")
          PY

      - name: Remove temporary package and commit channel update
        if: steps.input_check.outputs.present == 'true'
        shell: bash
        env:
          PACKAGE_FILE: ${{ steps.input_check.outputs.package }}
          END_DATE: ${{ steps.input_check.outputs.end }}
        run: |
          set -euo pipefail
          git rm "$PACKAGE_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/manifest.json updates/releases/master_delta_current.csv.gz updates/releases/master_delta_incremental.csv.gz
          git commit -m "MASTER mobile rescue import: $END_DATE"
          git fetch origin main
          git rebase origin/main
          git push
