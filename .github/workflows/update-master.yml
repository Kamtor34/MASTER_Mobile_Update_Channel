name: Update MASTER Mobile Channel

on:
  workflow_dispatch:
  schedule:
    # Günde 1 kez: 04:17 UTC = Türkiye saatiyle 07:17
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: master-mobile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout channel
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install --disable-pip-version-check requests

      - name: Resolve fetch window
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          m=json.loads(Path('updates/manifest.json').read_text(encoding='utf-8'))
          latest=datetime.strptime(m['latest_date'][:10],'%Y-%m-%d').date()
          today=datetime.now(ZoneInfo('Europe/Istanbul')).date()
          current=Path('updates/releases/master_delta_current.csv.gz')
          start=(latest-timedelta(days=7)) if current.exists() and current.stat().st_size>0 else (latest+timedelta(days=1))
          if start>today: start=today
          with open('dates.env','w',encoding='utf-8') as f:
              f.write(f'START={start.isoformat()}\nEND={today.isoformat()}\n')
          print(f'Fetch window: {start} -> {today}')
          PY
          cat dates.env >> "$GITHUB_ENV"

      - name: Build online delta or use browser JSON fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updates/releases .tmp/raw
          CURRENT=updates/releases/master_delta_current.csv.gz
          INCREMENTAL=updates/releases/master_delta_incremental.csv.gz
          set +e
          python tools/master_update_pipeline.py \
            --start "$START" \
            --end "$END" \
            --existing-delta "$CURRENT" \
            --out "$CURRENT" \
            --incremental-out "$INCREMENTAL" \
            --raw-dir .tmp/raw \
            --manifest updates/manifest.json \
            --public-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/updates/releases/master_delta_current.csv.gz" \
            --incremental-public-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/updates/releases/master_delta_incremental.csv.gz" 2>&1 | tee .tmp/online-update.log
          ONLINE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$ONLINE_STATUS" -eq 0 ]; then
            echo "UPDATE_SOURCE=online" >> "$GITHUB_ENV"
          elif grep -Eq 'HTTP (403|408|425|429|500|502|503|504)([^0-9]|$)' .tmp/online-update.log; then
            # Sahadan may block cloud requests (403) or return transient
            # gateway/server errors (408/429/5xx). Use the newest validated
            # browser-captured package; older ZIPs remain available for audit.
            RESCUE="$(python - <<'PY'
          import json, zipfile
          from pathlib import Path
          candidates=[]
          for path in Path('incoming').glob('sahadan_rescue_package*.zip'):
              try:
                  with zipfile.ZipFile(path) as archive:
                      meta_names=[n for n in archive.namelist() if n.endswith('.meta.json')]
                      if len(meta_names)!=1:
                          continue
                      meta=json.loads(archive.read(meta_names[0]))
                      start=meta.get('start_date')
                      end=meta.get('end_date')
                      if start and end:
                          candidates.append((end,start,str(path)))
              except Exception as exc:
                  print(f'Ignoring invalid rescue ZIP {path.name}: {exc}', file=__import__('sys').stderr)
          if not candidates:
              raise SystemExit('No valid incoming/sahadan_rescue_package*.zip found. Upload the browser-captured ZIP to incoming/.')
          newest=max((end,start) for end,start,path in candidates)
          selected=[path for end,start,path in candidates if (end,start)==newest]
          if len(selected)!=1:
              raise SystemExit(f'Ambiguous newest rescue packages for coverage {newest}: {selected}')
          print(selected[0])
          PY
          )"
            if [ ! -f "$RESCUE" ]; then
              echo "::error::No usable browser rescue package was selected. Existing published channel is retained."
              exit 1
            fi
            echo "Using newest browser rescue package: $RESCUE"
            python tools/merge_sahadan_rescue.py \
              --input "$RESCUE" \
              --current "$CURRENT" \
              --incremental "$INCREMENTAL" \
              --manifest updates/manifest.json \
              --public-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/updates/releases/master_delta_current.csv.gz" \
              --incremental-public-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/updates/releases/master_delta_incremental.csv.gz"
            # Keep the original ZIP as an audit/recovery source; do not delete it.
            echo "UPDATE_SOURCE=browser_json_fallback" >> "$GITHUB_ENV"
          else
            echo "::error::Online update failed without a supported fallback HTTP status. No fallback merge was attempted."
            exit "$ONLINE_STATUS"
          fi

      - name: Validate generated channel files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,gzip,hashlib,json
          from pathlib import Path
          m=json.loads(Path('updates/manifest.json').read_text(encoding='utf-8'))
          p=Path('updates/releases/master_delta_current.csv.gz')
          inc=Path('updates/releases/master_delta_incremental.csv.gz')
          assert m['enabled'] is True
          assert p.exists() and p.stat().st_size>0
          assert inc.exists() and inc.stat().st_size>0
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          assert hashlib.sha256(inc.read_bytes()).hexdigest()==m['incremental_sha256']
          with gzip.open(p,'rt',encoding='utf-8',newline='') as f:
              rows=sum(1 for _ in csv.DictReader(f))
          with gzip.open(inc,'rt',encoding='utf-8',newline='') as f:
              inc_rows=sum(1 for _ in csv.DictReader(f))
          assert rows==m['package_rows'],(rows,m['package_rows'])
          assert inc_rows==m['incremental_rows'],(inc_rows,m['incremental_rows'])
          print('Channel validation OK | cumulative=',rows,' incremental=',inc_rows)
          PY

      - name: Commit channel update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/manifest.json updates/releases/master_delta_current.csv.gz updates/releases/master_delta_incremental.csv.gz
          if [ -d incoming ]; then git add -A incoming; fi
          if git diff --cached --quiet; then
            echo "Yeni/değişen yayın yok."
            exit 0
          fi
          git commit -m "MASTER mobile delta: $END (${UPDATE_SOURCE:-online})"
          git fetch origin main
          git rebase origin/main
          git push
